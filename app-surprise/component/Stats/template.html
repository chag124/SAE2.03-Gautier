<div class="stats-container">
    <h2 class="stats-title">Statistiques de l'application</h2>
  
    <div class="stats-main">
        <div class="stat-card">
            <span class="stat-number">{{totalProfiles}}</span>
            <span class="stat-subtitle">Nombre total de profils crées</span>
        </div>

        <div class="stat-card">
            <span class="stat-number">{{avgFavorites}}</span>
            <span class="stat-subtitle">Nombre moyen de favoris par profil</span>
        </div>

        <div class="stat-card">
            <span class="stat-number">{{totalMovies}}</span>
            <span class="stat-subtitle">Nombre total de films</span>
        </div>

        <div class="stat-card highlight">
            <span class="stat-label">Film le plus ajouté aux favoris</span>
            <span class="stat-value">{{topMovie}}</span>
        </div>

        <div class="stat-card highlight">
            <span class="stat-label">Catégorie la plus populaire</span>
            <span class="stat-value">{{topCategory}}</span>
        </div>
    </div>

</div>

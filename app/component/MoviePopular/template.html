<div class="popular-card" onclick="C.handlerDetail('{{id}}')">
  <img src="../server/images/{{image}}" alt="affiche film" class="popular-card__image">
  <div class="popular-card__container">
    <div class="popular-card__content">
      <span class="badge">POPULAIRE</span>
      <h2 class="popular-card__title">{{name}}</h2>
      <p class="popular-card__description">{{description}}</p>
    </div>
  </div>
</div>

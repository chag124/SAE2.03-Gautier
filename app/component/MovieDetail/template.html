<div class="movie-detail">
  <button class="movie-detail__button" onclick="C.handlerHome()">Retour à la liste</button>

  <div class="movie-detail__trailer">
    <iframe src="{{trailer}}"frameborder="0" allowfullscreen></iframe>
  </div>

  <div class="movie-detail__container">
    <div class="movie-detail__image">
        <img src="../server/images/{{image}}" alt="affiche film">
    </div>

    <div class="movie-detail__info">
      <h1 class="movie-detail__title">{{name}}</h1>
      <span class="movie-detail__category">{{id_category}}</span>
      <p class="movie-detail__description">{{description}}</p>

      <div class="movie-detail__donnee">
        <p>Durée: {{length}} min</p>
        <p>Réalisateur: {{director}}</p>
        <p>Année de sortie: {{year}}</p>
        <p class="movie-detail__badge">Âge: {{min_age}}</p>
      </div>
    </div>
  </div>

</div>

<div class="admin-movie-item">
  <div class="admin-movie-item_info">
    <span class="admin-movie-item_name">{{name}}</span>
    <span class="admin-movie-item_category">({{year}})</span>
  </div>
  
  <form class="admin-movie-item_form">
    <label class="featured-label">
      <input 
        type="checkbox" 
        {{checked}} 
        onchange="C.handlerUpdateFeaturedStatus('{{id}}', this.checked)"
      >
      Mis en avant
    </label>
  </form>
</div>
